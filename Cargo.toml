[workspace]
resolver = "2"
members = [
    "crates/ucg-core",
    "crates/ucg-schema",
    "crates/cine-script",
    "crates/cine-previs",
    "crates/cine-logistics",
    "crates/cine-timeline",
    "crates/cine-comp",
    "crates/cine-media",
    "crates/cine-color",
    "crates/cine-audio",
    "crates/cine-audio-io",
    "crates/cine-gpu",
    "crates/cine-jobs",
    "crates/cine-pipeline",
    "crates/cine-runtime",
    "crates/cine-shell",
    "crates/cine-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://example.invalid/cine-omni"
# These crates are workspace-internal and are not published to crates.io. They
# depend on each other by path, which a publishable crate may not do. Declaring
# that here is accurate metadata, and it is what lets cargo-deny distinguish an
# internal path dependency from an unpinned registry wildcard.
publish = false
authors = ["CINE-OMNI Engineering"]

[workspace.dependencies]
# --- foundation ---
uuid = { version = "1", features = ["v4", "v5", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
smallvec = { version = "1", features = ["serde"] }
parking_lot = "0.12"
rayon = "1"
crossbeam-channel = "0.5"
petgraph = "0.8"
glam = { version = "0.30", features = ["serde"] }
rustfft = "6"
roxmltree = "0.20"
regex = "1"
# --- native interface ---
# egui for the editorial workspace, drawn onto the shell's own wgpu surface so
# the picture never leaves the GPU. egui_tiles provides real docking.
# Pinned exactly: these are the versions available offline, and egui 0.36
# is the series that targets wgpu 30.
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = { version = "0.36.2", default-features = false, features = ["wayland", "x11"] }
egui_tiles = "0.17.1"

# --- internal ---
ucg-core = { path = "crates/ucg-core" }
ucg-schema = { path = "crates/ucg-schema" }
cine-script = { path = "crates/cine-script" }
cine-previs = { path = "crates/cine-previs" }
cine-logistics = { path = "crates/cine-logistics" }
cine-timeline = { path = "crates/cine-timeline" }
cine-comp = { path = "crates/cine-comp" }
cine-media = { path = "crates/cine-media" }
cine-shell = { path = "crates/cine-shell" }
cine-color = { path = "crates/cine-color" }
cine-audio = { path = "crates/cine-audio" }
cine-audio-io = { path = "crates/cine-audio-io" }
cine-gpu = { path = "crates/cine-gpu" }
cine-jobs = { path = "crates/cine-jobs" }
cine-pipeline = { path = "crates/cine-pipeline" }
cine-runtime = { path = "crates/cine-runtime" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1

# Dependencies are compiled optimised and **without debug information**.
#
# Measured on this workspace: a cold `cargo test --workspace --no-run` into a
# fresh target directory is 9.41 GB with dependency debuginfo and 6.59 GB
# without — 30% smaller, and the smaller build contained three more test
# binaries than the larger one. The reason is that test binaries link
# statically: 159 executables measured 11.99 GiB on disk, of which 95% was
# `.debug*` sections, most of it from dependencies.
#
# The cost is that a debugger cannot step into `wgpu`, `naga` or `symphonia`.
# Workspace crates keep full debug information, which is where debugging
# actually happens. Turn this back on temporarily if you genuinely need to step
# into a dependency:
#
#     cargo test --config 'profile.dev.package."*".debug=true'
#
# See docs/blueprint/STORAGE-POLICY.md.
[profile.dev.package."*"]
opt-level = 2
debug = false
