[package]
name = "cine-shell"
description = "Native application shell: winit window, wgpu presentation, and the reference viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cine-gpu = { workspace = true, features = ["wgpu"] }
cine-media.workspace = true
cine-timeline.workspace = true
ucg-core.workspace = true
thiserror.workspace = true

egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
egui_tiles.workspace = true

wgpu = "30"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
# Only used by `--dump`, which writes the exact image the viewer presented so
# the conversion can be inspected rather than eyeballed on a screen.
image = { version = "0.25", default-features = false, features = ["png"] }
