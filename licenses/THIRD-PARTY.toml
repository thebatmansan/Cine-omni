# Third-party material that is not a Cargo dependency: code ported from another
# project, and data committed from one. Cargo dependencies are inventoried by
# Cargo.lock and policed by `cargo deny check` (deny.toml); this file covers
# what those cannot see. One [[entry]] per source. See
# docs/blueprint/01-LICENSING-SPINE.md §6.
#
# integration: "port"      — source translated into Rust in this repository
#              "test-data" — files committed under a tests/ directory, not shipped
#              "oracle"    — run by developers to generate test data, never shipped

[[entry]]
project = "aces-core (Academy Color Encoding System reference implementation)"
url = "https://github.com/aces-aswf/aces-core"
version = "commit 069b0bc3e1f6c62820f19fdae2fecec3f4fc0f80"
license = "Apache-2.0"
copyright = "Contributors to the ACES Project"
integration = "port"
used_by = ["crates/cine-color/src/aces2.rs"]
source_files = [
  "lib/Lib.Academy.OutputTransform.ctl",
  "lib/Lib.Academy.Tonescale.ctl",
  "lib/Lib.Academy.Utilities.ctl",
  "lib/Lib.Academy.DisplayEncoding.ctl (apply_white_scale)",
]
modifications = "Translated from CTL to Rust (f64). Structure, names and constants kept; deviations marked in the file header and inline. Display parameters for the 108/300-nit cinema and XYZ-E variants follow OpenColorIO's builtin definitions as measured."
license_text = "licenses/aces-core-Apache-2.0.txt"
notice_file = "none upstream"
obligations = "Apache-2.0 §4: ship the license text; keep the attribution header in aces2.rs; state changes."

[[entry]]
project = "aces-input-and-colorspaces (Academy colour space conversions)"
url = "https://github.com/aces-aswf/aces-input-and-colorspaces"
version = "commit 29b722bccd529460696a8382394504cae2e88419"
license = "Apache-2.0"
copyright = "Contributors to the ACES Project"
integration = "port"
used_by = ["crates/cine-color/src/ocio.rs (apple_log, adx)"]
source_files = [
  "apple/CSC.Apple.AppleLog_to_ACES.ctl",
  "apple/CSC.Apple.ACES_to_AppleLog.ctl",
  "ADX/CSC.Academy.ADX10_to_ACES.ctl",
  "ADX/CSC.Academy.ADX16_to_ACES.ctl",
  "ACEScc/CSC.Academy.ACES_to_ACEScc.ctl (consulted to adjudicate ACEScc below zero)",
]
modifications = "Translated from CTL to Rust. ADX is forward-only, as the reference defines it."
license_text = "licenses/aces-input-and-colorspaces-Apache-2.0.txt"
notice_file = "none upstream"
obligations = "Apache-2.0 §4: ship the license text; keep the attribution comments; state changes."

[[entry]]
project = "OpenColorIO-Config-ACES (released configs as shipped in OpenColorIO 2.5.2)"
url = "https://github.com/AcademySoftwareFoundation/OpenColorIO-Config-ACES"
version = "cg-config-v4.0.0_aces-v2.0_ocio-v2.5, studio-config-v4.0.0_aces-v2.0_ocio-v2.5"
license = "BSD-3-Clause"
copyright = "Contributors to the OpenColorIO Project"
integration = "test-data"
used_by = ["crates/cine-color/tests/data/configs/"]
modifications = "none; serialised by PyOpenColorIO"
obligations = "BSD-3-Clause attribution if redistributed; not part of the shipped application."

[[entry]]
project = "OpenColorIO / PyOpenColorIO"
url = "https://github.com/AcademySoftwareFoundation/OpenColorIO"
version = "2.5.2"
license = "BSD-3-Clause"
copyright = "Contributors to the OpenColorIO Project"
integration = "oracle"
used_by = [
  "crates/cine-color/tests/data/generate_reference.py",
  "crates/cine-color/tests/data/generate_display_styles.py",
  "crates/cine-color/tests/data/generate_aces2.py",
  "crates/cine-color/tests/data/generate_config_views.py",
  "crates/cine-color/tests/data/generate_config_colorspaces.py",
  "crates/cine-color/tests/data/generate_file_rules.py",
]
modifications = "none; not linked, not shipped. Its outputs are committed as reference values (*.tsv)."
obligations = "none for the application: compatibility is established by comparing outputs, and nothing from it is compiled in."
