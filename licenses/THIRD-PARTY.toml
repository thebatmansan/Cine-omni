obligations = "BSD-3-Clause: binary distributions must reproduce the copyright notice, conditions and disclaimer in their documentation; no endorsement by the copyright holders' names."

[[entry]]
project = "ASC MHL (Media Hash List) specification"
url = "https://github.com/ascmitc/mhl"
version = "v2.0 (format), implemented from the published specification"
license = "MIT (specification and reference tool)"
copyright = "American Society of Cinematographers"
integration = "format"
used_by = ["crates/cine-media/src/mhl.rs"]
modifications = "An independent implementation of a subset of the format: generations with xxh64/xxh3/md5/sha1 hashes, read and written. No reference-tool code was used; the implementation has not been validated against the reference `ascmhl` tool, which the capability matrix records."
obligations = "none: a file format carries no licence on the files that read it."

[[entry]]
project = "Blender"
url = "https://www.blender.org/"
version = "4.2.4 LTS"
license = "GPL-2.0-or-later"
copyright = "Blender Foundation and contributors"
integration = "oracle"
used_by = ["crates/cine-comp/tests/data/blender_exr_oracle.py"]
modifications = "none. Run as a separate program on the command line to read an OpenEXR file and print pixel values, which are committed as reference data (tests/data/exr-oracle.tsv). Nothing of Blender is linked, copied or distributed, and no Blender source was read."
obligations = "none for CINE-OMNI: a GPL program used as a tool imposes nothing on what it is used on. The EXR it reads is Blender's own installed data file and is not committed."

